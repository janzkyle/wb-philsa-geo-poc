name: Deploy partner template to GitHub Pages

# Publishes the self-contained partner-template/ starter (a single index.html)
# to GitHub Pages. The template has no build step — we just upload the folder.

on:
  push:
    branches: [main]
    paths:
      - "partner-template/**"
      - ".github/workflows/deploy-partner-template.yml"
  workflow_dispatch: # allow manual "Run workflow" from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload partner-template as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: partner-template

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
