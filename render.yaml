# PhilSA POC — Render Blueprint (Infrastructure as Code).
#
# One file deploys the whole app surface on Render's FREE tier:
#   • philsa-stac-api  — STAC FastAPI (Docker, from the stac-fastapi-pgstac submodule)
#   • philsa-titiler   — dynamic raster tiler for the R2 COGs (Docker)
#   • philsa-browser   — STAC Browser explorer UI (static site)
#   • philsa-webmap    — MapLibre webmap (static site)
#
# The database is NOT here — it lives on Neon (see deploy/DEPLOYMENT.md).
# Deploy: push this repo to GitHub, then Render ▸ New ▸ Blueprint ▸ pick the repo.
# Secrets (Neon creds, R2 keys) are marked `sync: false` — Render prompts for
# them at deploy time and never stores them in git.
#
# NOTE on URLs: the frontend build vars below assume Render gives each service
# its `https://<name>.onrender.com` URL. If a name is already taken in your
# account Render appends a suffix — then update the *_API / SB_catalogUrl vars to
# the real URLs and redeploy the two static sites. See DEPLOYMENT.md §5.

services:
  # ---------------------------------------------------------------- STAC API --
  - type: web
    name: philsa-stac-api
    runtime: docker
    plan: free
    region: singapore                       # closest free region to the Philippines
    dockerfilePath: ./deploy/stac-api/Dockerfile   # pins deps for reproducible builds
    dockerContext: ./stac-fastapi-pgstac
    dockerCommand: uvicorn stac_fastapi.pgstac.app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    # Only redeploy when the STAC API's own code/build files change — not on every
    # webmap/docs commit (auto-deploy fires per-service on commits to the branch).
    buildFilter:
      paths:
        - stac-fastapi-pgstac/**
        - deploy/stac-api/**
    healthCheckPath: /_mgmt/ping
    envVars:
      - key: ENVIRONMENT
        value: production
      # --- Neon connection (fill in at deploy time from prod.env) ---
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        value: neondb
      - key: PGSSLMODE       # Neon requires TLS
        value: require
      # --- pgSTAC / server tuning (free tier = 512 MB, keep the pool tiny) ---
      - key: DB_MIN_CONN_SIZE
        value: "1"
      - key: DB_MAX_CONN_SIZE
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: USE_API_HYDRATE
        value: "false"
      # READ-ONLY in prod. The public API must never accept writes (a public
      # Transactions endpoint = anyone can POST/PUT/DELETE catalog items). Prod
      # ingest/migration now runs against Neon through a PRIVATE, ephemeral
      # transactions-enabled API — see deploy/scripts/prod-ingest.sh and
      # deploy/DEPLOYMENT.md. Local dev keeps transactions ON via compose.
      - key: ENABLE_TRANSACTIONS_EXTENSIONS
        value: "false"
      - key: VSI_CACHE
        value: "TRUE"
      - key: GDAL_HTTP_MERGE_CONSECUTIVE_RANGES
        value: "YES"
      - key: GDAL_DISABLE_READDIR_ON_OPEN
        value: EMPTY_DIR
      # --- PhilSA branding (landing page / OpenAPI docs) ---
      - key: STAC_FASTAPI_TITLE
        value: PhilSA Geospatial STAC API
      - key: STAC_FASTAPI_LANDING_ID
        value: philsa-geo-stac
      # --- Open-data CORS contract (external agencies consume this in-browser) ---
      # STAC-FastAPI already DEFAULTS cors_origins to "*", but declaring it here
      # makes the open-data contract deliberate — a dependency bump can't silently
      # narrow it. Origins "*" is safe only with credentials OFF (default). Methods
      # must include POST (/search is a POST) and OPTIONS (browser preflight).
      # Naming gotcha: the Settings fields are cors_origins/cors_methods with NO
      # env prefix, so the vars are CORS_ORIGINS/CORS_METHODS — unlike TiTiler's
      # TITILER_API_* below. (STAC_FASTAPI_TITLE works only because that field is
      # literally named stac_fastapi_title; a STAC_FASTAPI_CORS_* var is silently
      # ignored. See stac-fastapi-pgstac/tests/test_config.py.)
      # NOTE: this opens READ access to any origin; writes are already impossible
      # here (ENABLE_TRANSACTIONS_EXTENSIONS=false above). The edge gateway
      # (deploy/gateway/) re-blocks writes too, as defense-in-depth.
      - key: CORS_ORIGINS
        value: "*"
      - key: CORS_METHODS
        value: "GET,POST,OPTIONS"

  # ----------------------------------------------------------------- TiTiler --
  - type: web
    name: philsa-titiler
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/titiler/Dockerfile
    dockerContext: ./deploy/titiler
    autoDeploy: true
    buildFilter:
      paths:
        - deploy/titiler/**
    envVars:
      # R2 (S3-compatible) creds — same values as the repo-root .env.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT                  # <R2_ACCOUNT_ID>.r2.cloudflarestorage.com
        sync: false
      # boto3 ignores GDAL's AWS_S3_ENDPOINT; cogeo-mosaic's S3 backend (the
      # /mosaicjson s3:// reads) needs the boto3-native endpoint var, WITH the
      # https:// scheme: https://<R2_ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_VIRTUAL_HOSTING
        value: "FALSE"
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_HTTPS
        value: "YES"
      - key: GDAL_DISABLE_READDIR_ON_OPEN
        value: EMPTY_DIR
      - key: GDAL_HTTP_MERGE_CONSECUTIVE_RANGES
        value: "YES"
      - key: CPL_VSIL_CURL_ALLOWED_EXTENSIONS
        value: ".tif,.tiff"
      - key: VSI_CACHE
        value: "TRUE"
      - key: TITILER_API_CORS_ORIGINS
        value: "*"
      # Origin guard. This service can read the PRIVATE R2 bucket and Render gives
      # it a public hostname, so without this anyone who knows that hostname can
      # render restricted imagery and skip the gateway's access checks entirely.
      # Must match the gateway's ORIGIN_SHARED_SECRET Worker secret.
      # UNSET = fail open (previous behaviour), so deploy the gateway first, then
      # set this. See deploy/AUTH.md → "Locking the origins to the gateway".
      - key: GATEWAY_SHARED_SECRET
        sync: false
      # Concurrent tile renders. A zoomed-out map makes MapLibre request a whole
      # tile grid at once; each render peaks ~180 MB, so unbounded concurrency
      # OOM-kills this service (free/starter = 512 MB). 1 keeps it alive by making
      # the burst queue — slower under load, never a 5xx.
      # Bump this WITH `plan:` above if you upgrade: ~2 on standard (2 GB/1 CPU),
      # ~3 on pro (4 GB/2 CPU). CPU bounds it as much as RAM — renders are
      # CPU-bound, so more memory alone doesn't buy more concurrency.
      - key: TITILER_MAX_CONCURRENT_RENDERS
        value: "1"

  # ------------------------------------------------------------ STAC Browser --
  # Static site: type=web + runtime=static. staticPublishPath is relative to the
  # repo root, so we `cd` into the submodule in the build command rather than
  # relying on rootDir (which does not rebase the publish path).
  - type: web
    runtime: static
    name: philsa-browser
    buildCommand: cd stac-browser && npm ci && npm run build
    staticPublishPath: stac-browser/dist
    autoDeploy: true
    buildFilter:
      paths:
        - stac-browser/**
    pullRequestPreviewsEnabled: false
    envVars:
      # The Browser is locked to this one catalog (allowExternalAccess:false).
      # Points at the always-on STAC gateway, not the onrender origin directly.
      - key: SB_catalogUrl
        value: https://philsa-stac-gateway.philsa.workers.dev
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ----------------------------------------------------------------- Webmap ---
  - type: web
    runtime: static
    name: philsa-webmap
    buildCommand: cd webmap && npm ci && npm run build
    staticPublishPath: webmap/dist
    autoDeploy: true
    buildFilter:
      paths:
        - webmap/**
    pullRequestPreviewsEnabled: false
    envVars:
      # STAC + tiles go through the always-on Cloudflare gateway (deploy/gateway/):
      # edge cache + read-only enforcement in front of the free-tier origins.
      - key: VITE_STAC_API
        value: https://philsa-stac-gateway.philsa.workers.dev
      - key: VITE_TITILER
        value: https://philsa-tiles-gateway.philsa.workers.dev
      # The Browser UI is a static site, not fronted by the gateway — its own URL.
      - key: VITE_STAC_BROWSER
        value: https://philsa-browser.onrender.com
      # The map assistant's chat backend (deploy/chat/, source webmap/server/).
      # MUST be set here: this site is STATIC, so without it the frontend falls
      # back to the relative "/api/chat" (see webmap/src/config.ts), which the
      # static host answers with an empty 200 and the chat silently does nothing.
      # It's a Worker, not a Render service, so there's no cold start to hide.
      - key: VITE_CHAT_API
        value: https://philsa-chat.philsa.workers.dev/api/chat
      - key: VITE_R2_PUBLIC_BASE
        value: https://pub-17ab60a2ca7142a48ae8e2685cd853f7.r2.dev
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
