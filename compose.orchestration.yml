# Orchestration tier: Dagster webserver (UI) + daemon (sensors/schedules) for
# the pipelines/ asset graph. See pipelines/orchestration/ for the definitions.
#
# Joins the pgSTAC compose network (stac-fastapi-network) so it reaches:
#   - Postgres as `database:5432` (run/event storage in a `dagster` DB —
#     create it once, see pipelines/orchestration/dagster.yaml)
#   - the STAC API as `app:8082` (gold cataloging step)
# Start the stac-fastapi-pgstac compose first, then:
#
#   docker compose -f compose.orchestration.yml up -d --build
#
# Secrets (R2 / CopPhil) reach the containers via env_file: .env. The one value
# env_file can't supply is the Dagster storage DB password: dagster.yaml needs
# DAGSTER_PG_PASSWORD resolvable at config-load time, so it's set below via
# ${DAGSTER_PG_PASSWORD:-password} — Compose auto-reads the repo-root .env for
# interpolation and falls back to `password`, the pgSTAC dev credential already
# committed in stac-fastapi-pgstac/compose.yml (not a real secret).
# Host port 3000 is often busy, hence 3030 -> UI at http://localhost:3030.
# The repo is bind-mounted (scripts resolve the repo root via the AGENTS.md
# marker); code edits only need a container restart.
# The CopPhil sensor + daily schedule ship OFF — enable them in the UI.
services:
  dagster-webserver:
    build: pipelines/orchestration
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /opt/philsa/pipelines/orchestration
      DAGSTER_PG_HOST: database
      DAGSTER_PG_PASSWORD: "${DAGSTER_PG_PASSWORD:-password}"
      STAC_API: http://app:8082
      # GDAL/rasterio S3 config so the in-container mosaic build (cogeo-mosaic)
      # reads silver COGs from R2 the same way TiTiler does (mirrors compose.viz.yml).
      AWS_S3_ENDPOINT: "${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_DEFAULT_REGION: auto
      AWS_HTTPS: "YES"
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.tiff"
      VSI_CACHE: "TRUE"
    volumes:
      - .:/opt/philsa
    ports:
      - "3030:3000"
    command: dagster-webserver -h 0.0.0.0 -p 3000 -m definitions
    restart: unless-stopped

  dagster-daemon:
    build: pipelines/orchestration
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /opt/philsa/pipelines/orchestration
      DAGSTER_PG_HOST: database
      DAGSTER_PG_PASSWORD: "${DAGSTER_PG_PASSWORD:-password}"
      STAC_API: http://app:8082
      # GDAL/rasterio S3 config so the in-container mosaic build (cogeo-mosaic)
      # reads silver COGs from R2 the same way TiTiler does (mirrors compose.viz.yml).
      AWS_S3_ENDPOINT: "${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_DEFAULT_REGION: auto
      AWS_HTTPS: "YES"
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.tiff"
      VSI_CACHE: "TRUE"
    volumes:
      - .:/opt/philsa
    command: dagster-daemon run -m definitions
    restart: unless-stopped

networks:
  default:
    name: stac-fastapi-network
    external: true
